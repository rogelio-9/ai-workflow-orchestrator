syntax = "proto3";

package llm_gateway.v1;

service LLMGateway {
  rpc RunCompletion(CompletionRequest) returns (CompletionResponse);
}

// Fields are `optional` for explicit presence: in plain proto3 a scalar has no
// unset state, so temperature=0 (deterministic) is indistinguishable from
// "caller said nothing" and would silently fall back to the provider default.
message GenerationConfig {
  optional float temperature = 1;
  optional int32 max_tokens  = 2;
  optional int32 top_k       = 3;
  optional float top_p       = 4;
}

message CompletionRequest {
  string run_id = 1;
  string step_id = 2;
  string prompt = 3;
  string model = 4;
  GenerationConfig config = 5;
}

message CompletionResponse {
  string completion = 1;
  int32 prompt_tokens = 2;
  int32 completion_tokens = 3;
  int32 latency_ms = 4;
}