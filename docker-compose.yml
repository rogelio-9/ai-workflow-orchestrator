services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  # Topics were created by hand on D8 and D10, which meant a `compose down`
  # silently destroyed them: auto-create is off, so the producer's delivery
  # callback fails behind an otherwise clean 201 and nothing consumes.
  # Idempotent, so it is safe on every boot.
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      kafka:
        condition: service_healthy
    # Every line at the same indent: a `>` folded scalar keeps newlines on any
    # line indented further than the first, which breaks the command apart.
    command: >
      bash -c "
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic workflow.tasks --partitions 3 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic workflow.tasks.dlq --partitions 3 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:29092 --list
      "

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: orchestrator
      POSTGRES_DB: orchestrator
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrator"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  orchestrator:
    build: ./services/orchestrator
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./services/orchestrator:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg2://orchestrator:orchestrator@postgres:5432/orchestrator
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # retry clears the worker's markers, so the orchestrator needs the same
      # Redis the worker writes them to.
      REDIS_URL: redis://redis:6379

  llm-gateway:
    build:
      # Root context so the Dockerfile can reach the shared gen/ stubs.
      context: .
      dockerfile: services/llm-gateway/Dockerfile
    ports:
      - "50052:50052"
    # Speaks grpc.health.v1 against itself. No extra binary needed -- grpcio
    # and grpc_health are already in the image for the server side.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import grpc, sys
          from grpc_health.v1 import health_pb2, health_pb2_grpc
          ch = grpc.insecure_channel("localhost:50052")
          r = health_pb2_grpc.HealthStub(ch).Check(health_pb2.HealthCheckRequest(), timeout=3)
          sys.exit(0 if r.status == health_pb2.HealthCheckResponse.SERVING else 1)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      redis:
        condition: service_healthy
    environment:
      GRPC_PORT: 50052
      # Ollama runs on the host, not in compose -- neither `localhost` (the
      # container itself) nor a service name reaches it.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      REDIS_URL: redis://redis:6379
      # Read from .env, never committed. Absent is fine: the gemini provider
      # fails terminally with a clear message rather than at startup.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Gemini's free tier is ~10 RPM; 0 means unlimited, which is right for
      # a local Ollama and for the mock.
      RATE_LIMIT_GEMINI: 10

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://orchestrator:orchestrator@postgres:5432/orchestrator
      # Reads hit Postgres directly; writes will go here so the orchestrator
      # stays the only thing that validates a DAG and publishes to Kafka.
      ORCHESTRATOR_URL: http://orchestrator:8000
      # From .env, never committed. Absent means auth fails closed with a
      # 500 rather than verifying every signature against "".
      JWT_SECRET: ${JWT_SECRET:-}
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      REDIS_URL: redis://redis:6379
      # Per user, unlike the LLM gateway's per-provider limit: this one
      # stops one caller monopolising the workers.
      RATE_LIMIT_PER_USER: 30

  llm-worker:
    build:
      context: .
      dockerfile: services/workers/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      # The consumer of the health service added on D17: without this the
      # worker can subscribe and pull a step before the gateway is listening,
      # and burn a retry on a connection refusal.
      llm-gateway:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://orchestrator:orchestrator@postgres:5432/orchestrator
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_URL: redis://redis:6379
      LLM_GATEWAY_GRPC: llm-gateway:50052

volumes:
  postgres_data: